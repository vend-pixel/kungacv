name: Keep Dependabot branches up to date

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-dependabot-branches-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  update:
    name: Update Dependabot branches
    runs-on: ubuntu-latest
    steps:
      - name: Update open Dependabot pull requests
        uses: actions/github-script@v7
        with:
          script: |
            const base = context.ref.replace('refs/heads/', '');
            const { owner, repo } = context.repo;
            const { data: pulls } = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              base,
              per_page: 100,
            });

            for (const pull of pulls.filter((pr) =>
              pr.user?.login === 'dependabot[bot]' &&
              pr.head.repo?.full_name === `${owner}/${repo}`
            )) {
              try {
                await github.rest.pulls.updateBranch({
                  owner,
                  repo,
                  pull_number: pull.number,
                  expected_head_sha: pull.head.sha,
                });
                core.info(`Requested base update for PR #${pull.number}: ${pull.title}`);
              } catch (error) {
                if (error.status === 422) {
                  core.info(`PR #${pull.number} is already up to date or has a conflicting update; leaving it unchanged.`);
                } else {
                  core.warning(`Could not update PR #${pull.number}: ${error.message}`);
                }
              }
            }
