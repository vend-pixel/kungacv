version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
    rebase-strategy: auto
    open-pull-requests-limit: 3
    groups:
      backend-patch-and-minor:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /frontend/kungacv_client
    schedule:
      interval: weekly
    rebase-strategy: auto
    open-pull-requests-limit: 3
    groups:
      client-patch-and-minor:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /frontend/kungacv_admin
    schedule:
      interval: weekly
    rebase-strategy: auto
    open-pull-requests-limit: 3
    groups:
      admin-patch-and-minor:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    rebase-strategy: auto
